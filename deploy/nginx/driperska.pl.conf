# Host nginx vhost. The app container listens only on 127.0.0.1:18080,
# so it cannot collide with other applications on this server.
server {
    listen 80;
    listen [::]:80;
    server_name driperska.pl www.driperska.pl;
    return 301 https://driperska.pl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name driperska.pl www.driperska.pl;

    # Cloudflare Origin Certificate (15 years, only trusted through Cloudflare).
    ssl_certificate /etc/nginx/ssl/driperska.pl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/driperska.pl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Required for the long-lived realtime draw stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no;
    }
}