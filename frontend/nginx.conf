server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the backend at request time keeps this
    # container alive during a brief backend replacement on deployment.
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        # Replays (.rofl) and highlight videos can be hundreds of MB; default nginx cap is 1MB.
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Do not make common secret-file probes look like successful SPA routes.
    location ~ (^|/)\.env($|[./%]) {
        return 404;
    }

    location /media/ {
        alias /media/;
        expires 7d;
        # Declaring any add_header here drops the server-level ones, and user-uploaded media is
        # exactly where a missing nosniff matters.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # AdSense verifies the publisher by fetching this from the domain root.
    location = /ads.txt {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # The SPA shell (index.html + routes) must never be cached, otherwise a deploy leaves users
        # on a stale build until a hard refresh (Ctrl+F5). Hashed /assets stay immutable above.
        # add_header does not inherit once a block declares any, so the headers are re-included here.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}