# Security headers, in one place.
#
# nginx's add_header does not inherit once a nested block declares any of its own, so these have to
# be repeated in every location that sets a header. They used to be copy-pasted twice, which meant a
# CSP change could silently apply to only one of them; this snippet is included instead.
#
# ---------------------------------------------------------------------------------------------------
# A note on the CSP, because it is deliberately weaker than it was.
#
# AdSense cannot run under `script-src 'self'`. Serving ads requires allowing Google's ad hosts and,
# unavoidably, 'unsafe-inline' — the adsbygoogle library injects inline <script> nodes, and Google
# publishes no nonce or hash set to whitelist instead. The cost is real: 'unsafe-inline' removes the
# script half of the XSS mitigation this header exists to provide, leaving output encoding as the
# only defence. That is the price of monetising the site, and it is worth stating plainly rather than
# burying in a diff.
#
# 'unsafe-eval' is intentionally NOT granted. Basic display units generally work without it. If ad
# units stay blank and the browser console reports an eval violation from an ad frame, that is the
# next knob — but try everything else first.
#
# ep1/ep2.adtrafficquality.google are Google's ad-traffic-quality endpoints; units are served without
# them but the library logs CSP violations on every impression.
# ---------------------------------------------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://pagead2.googlesyndication.com https://partner.googleadservices.com https://tpc.googlesyndication.com https://www.googletagservices.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ddragon.leagueoflegends.com https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://googleads.g.doubleclick.net https://www.google.com https://www.gstatic.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google; connect-src 'self' https://challenges.cloudflare.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google; frame-src https://challenges.cloudflare.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# Ad creatives are iframes we embed; this header governs us being embedded, so it stays DENY.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
