# Security headers, in one place.
#
# nginx's add_header does not inherit once a nested block declares any of its own, so these have to
# be repeated in every location that sets a header. They used to be copy-pasted twice, which meant a
# CSP change could silently apply to only one of them; this snippet is included instead.
#
# The policy is strict on purpose. 0.4.7 relaxed it for AdSense — Google's ad library needs its own
# hosts plus 'unsafe-inline', which costs the script half of this header's XSS mitigation. Ads were
# dropped in 0.4.10, so that allowance is gone again: script-src is back to 'self' plus Cloudflare
# Turnstile, and nothing else may execute. Don't loosen this without a concrete reason worth the
# trade.
#
# Remaining third parties are all non-script: Google Fonts (styles + font files) and Riot's Data
# Dragon (champion art).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ddragon.leagueoflegends.com; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
