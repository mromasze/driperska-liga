# SQLite configuration
spring.datasource.url=jdbc:sqlite:src/main/resources/database.sqlite
spring.datasource.driverClassName=org.sqlite.JDBC

spring.datasource.hikari.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.jdbc-url=jdbc:sqlite:src/main/resources/database.sqlite
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.platform=sqlite
spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect
