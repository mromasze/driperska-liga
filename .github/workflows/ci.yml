name: CI

on:
  push:
    branches: [ main, driperska-next ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        working-directory: backend
        run: ./mvnw -B verify
        env:
          JWT_SECRET: ci-secret-that-is-at-least-32-bytes-long-ok!!

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint & typecheck
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          docker build --label "pl.driperska.version=$version" -t driperska-backend:latest ./backend
      - name: Build frontend image
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          docker build --label "pl.driperska.version=$version" -t driperska-web:latest ./frontend
      - name: Package production images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          docker image save driperska-backend:latest driperska-web:latest |
            gzip -1 > release/docker-images.tar.gz
      - name: Upload production image package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: driperska-images
          path: release/docker-images.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
