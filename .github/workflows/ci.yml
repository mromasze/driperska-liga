name: CI

on:
  push:
    branches: [ main, driperska-next ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        working-directory: backend
        run: ./mvnw -B verify
        env:
          JWT_SECRET: ci-secret-that-is-at-least-32-bytes-long-ok!!

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint & typecheck
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t driperska-backend ./backend
      - name: Build frontend image
        run: docker build -t driperska-frontend ./frontend
