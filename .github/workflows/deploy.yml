name: Deploy production

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: driperska-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download images built by CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: driperska-images
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Build images for a manual deployment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          docker build --pull --label "pl.driperska.version=$version" -t driperska-backend:latest ./backend
          docker build --pull --label "pl.driperska.version=$version" -t driperska-web:latest ./frontend
          mkdir -p release
          docker image save driperska-backend:latest driperska-web:latest |
            gzip -1 > release/docker-images.tar.gz

      - name: Verify release package
        run: test -s release/docker-images.tar.gz

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Prepare release directories
        shell: bash
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/release' '$DEPLOY_PATH/deploy/scripts'"

      - name: Upload prebuilt release
        shell: bash
        run: |
          rsync -a VERSION "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          rsync -a deploy/scripts/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/scripts/"
          rsync -a release/docker-images.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/release/docker-images.tar.gz"

      - name: Load images and start production
        shell: bash
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && chmod +x deploy/scripts/*.sh && ./deploy/scripts/deploy.sh"
